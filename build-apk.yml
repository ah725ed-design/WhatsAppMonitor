name: Build WhatsApp Monitor APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Gradle
        run: |
          curl -L https://services.gradle.org/distributions/gradle-8.9-bin.zip -o gradle.zip
          unzip -q gradle.zip
          echo "$PWD/gradle-8.9/bin" >> "$GITHUB_PATH"
      - name: Unpack project and build APK
        run: |
          unzip -q WhatsAppMonitorAndroid_Source.zip -d source
          cd source/WhatsAppMonitorAndroid
          gradle --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: WhatsAppMonitor-debug-apk
          path: source/WhatsAppMonitorAndroid/app/build/outputs/apk/debug/app-debug.apk
